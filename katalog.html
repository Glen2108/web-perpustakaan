<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katalog Buku - Perpustakaan SMAN 4 Manado</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800">

  <header class="bg-slate-900 text-white sticky top-0 z-40 border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
      <a href="index.html" class="font-black text-lg">PERPUSTAKAAN SMAN 4 MANADO</a>
      <nav class="space-x-6 text-sm font-semibold">
        <a href="index.html" class="hover:text-amber-400">Beranda</a>
        <a href="katalog.html" class="text-amber-400 font-bold">Katalog</a>
        <a href="duta-literasi.html" class="hover:text-amber-400">Duta Literasi</a>
      </nav>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-6 py-10 space-y-8">
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-white p-6 rounded-3xl border border-slate-200 shadow-sm">
      <div>
        <h2 class="text-2xl font-black text-slate-900">Katalog Fisik Perpustakaan</h2>
        <p class="text-xs text-slate-500 mt-1">Daftar koleksi buku perpustakaan yang dikelompokkan berdasarkan kategori.</p>
      </div>
      <div id="statTotal" class="bg-blue-50 text-blue-900 px-4 py-2 rounded-2xl text-xs font-bold">
        Total Koleksi: <span id="countBuku" class="text-sm font-black">0</span> Ekslempar
      </div>
    </div>

    <!-- Container Tabel per Kategori -->
    <div id="containerKatalog" class="space-y-8">
      <div class="bg-white p-12 rounded-3xl border border-slate-200 text-center py-12 text-slate-400 text-sm">
        Memuat katalog buku...
      </div>
    </div>
  </main>

  <script type="module">
    import { db } from './js/firebase-config.js';
    import { collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

    // Memuat data buku secara real-time dari Firestore
    function listenKatalog() {
      const container = document.getElementById('containerKatalog');

      onSnapshot(collection(db, "buku"), (snap) => {
        if (snap.empty) {
          onSnapshot(collection(db, "katalog"), (snapKatalog) => {
            renderBukuTables(snapKatalog);
          });
        } else {
          renderBukuTables(snap);
        }
      }, (err) => {
        console.error("Gagal memuat katalog:", err);
        container.innerHTML = `<p class="text-center py-8 text-rose-500 font-bold">Gagal memuat katalog dari basis data.</p>`;
      });
    }

    // Menampilkan buku yang dikelompokkan ke dalam Tabel berdasarkan Kategori
    function renderBukuTables(snap) {
      const container = document.getElementById('containerKatalog');
      let totalEkslempar = 0;
      const listBuku = [];

      snap.forEach(docSnap => {
        const b = docSnap.data();
        const stok = Number(b.stok ?? b.ekslempar ?? 0);
        totalEkslempar += stok;
        listBuku.push({
          firestoreId: docSnap.id,
          ...b,
          stok: stok
        });
      });

      document.getElementById('countBuku').innerText = totalEkslempar;

      if (listBuku.length === 0) {
        container.innerHTML = `<div class="bg-white p-8 rounded-3xl border border-slate-200 text-center text-slate-400 font-medium text-sm">Belum ada koleksi buku di katalog.</div>`;
        return;
      }

      // Pengelompokan berdasarkan Kategori
      const grouped = {};
      listBuku.forEach(buku => {
        const kat = (buku.kategori || 'Lainnya').trim();
        if (!grouped[kat]) grouped[kat] = [];
        grouped[kat].push(buku);
      });

      let html = "";

      Object.keys(grouped).forEach(kategoriName => {
        const items = grouped[kategoriName];

        html += `
          <div class="bg-white rounded-3xl p-6 border border-slate-200 shadow-sm space-y-4">
            <div class="flex items-center justify-between border-b border-slate-100 pb-3">
              <h3 class="text-lg font-black text-slate-900 flex items-center gap-2">
                <i class="fa-solid fa-bookmark text-blue-600"></i> Kategori: ${kategoriName}
              </h3>
              <span class="text-xs font-bold px-3 py-1 rounded-full bg-blue-50 text-blue-700">
                ${items.length} Judul Buku
              </span>
            </div>

            <div class="overflow-x-auto rounded-2xl border border-slate-100">
              <table class="w-full text-left text-xs">
                <thead class="bg-slate-50 text-slate-600 font-extrabold uppercase border-b border-slate-100">
                  <tr>
                    <th class="p-3.5 text-center w-12">No</th>
                    <th class="p-3.5">Cover</th>
                    <th class="p-3.5">Judul Buku</th>
                    <th class="p-3.5">Pengarang</th>
                    <th class="p-3.5">Penerbit</th>
                    <th class="p-3.5 text-center">BOS Tahap</th>
                    <th class="p-3.5 text-center">Status Sisa Buku</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100 font-medium text-slate-700">
                  ${items.map((b, idx) => `
                    <tr class="hover:bg-slate-50/80 transition">
                      <td class="p-3.5 text-center font-bold text-slate-400">${idx + 1}</td>
                      <td class="p-3.5">
                        <img src="${b.cover || b.coverUrl || 'https://via.placeholder.com/60x80?text=No+Cover'}" class="w-10 h-14 object-cover rounded-lg shadow-sm border">
                      </td>
                      <td class="p-3.5 font-bold text-slate-900">${b.judul || '-'}</td>
                      <td class="p-3.5 text-slate-600">${b.pengarang || '-'}</td>
                      <td class="p-3.5 text-slate-500">${b.penerbit || '-'}</td>
                      <td class="p-3.5 text-center">
                        ${b.bosTahap ? `<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-amber-100 text-amber-800">Tahap ${b.bosTahap}</span>` : '<span class="text-slate-400">-</span>'}
                      </td>
                      <td class="p-3.5 text-center">
                        <button class="px-3.5 py-1.5 rounded-xl font-bold text-xs shadow-sm cursor-default transition ${b.stok > 0 ? 'bg-emerald-600 hover:bg-emerald-700 text-white' : 'bg-rose-500 text-white'}">
                          ${b.stok > 0 ? `Sisa: ${b.stok} Ekslempar` : 'Stok Habis'}
                        </button>
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    listenKatalog();
  </script>
</body>
</html>
