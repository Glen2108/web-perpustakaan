<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katalog Buku - Perpus SMAN 4 Manado</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800">

  <header class="bg-blue-900 text-white shadow-md">
    <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
      <h1 class="text-xl font-extrabold tracking-wide">Perpus SMAN 4 Manado</h1>
      <nav class="space-x-6 text-sm font-semibold">
        <a href="index.html" class="hover:text-blue-200">Beranda</a>
        <a href="katalog.html" class="underline underline-offset-4 text-blue-200">Katalog</a>
        <a href="duta-literasi.html" class="hover:text-blue-200">Duta Literasi</a>
        <a href="admin/dashboard.html" class="bg-blue-800 hover:bg-blue-700 px-3 py-1.5 rounded-lg">Admin Panel</a>
      </nav>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-6 py-10 space-y-10">
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
      <div>
        <h2 class="text-3xl font-black text-slate-900">Katalog Koleksi Buku</h2>
        <p class="text-sm text-slate-500 mt-1">Cari dan rencanakan peminjaman buku secara mandiri.</p>
      </div>
    </div>

    <div id="gridKatalog" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
      <p class="col-span-full text-center text-slate-400 py-10">Memuat data katalog buku...</p>
    </div>
  </main>

  <script type="module">
    import { ENDPOINT } from './js/firebase-config.js';

    async function fetchKatalog() {
      const query = `query { books { id title author availableCopies } }`;
      const grid = document.getElementById("gridKatalog");
      try {
        const res = await fetch(ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query })
        });
        const { data } = await res.json();
        const books = data?.books || [];

        if (!books.length) {
          grid.innerHTML = `<p class="col-span-full text-center text-slate-400 py-10">Belum ada koleksi buku di database.</p>`;
          return;
        }

        grid.innerHTML = books.map(b => `
          <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm flex flex-col justify-between">
            <div>
              <span class="inline-block px-2.5 py-1 text-[11px] font-bold rounded-full ${b.availableCopies > 0 ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-800'}">
                ${b.availableCopies > 0 ? `Tersedia (${b.availableCopies})` : 'Habis Dipinjam'}
              </span>
              <h3 class="font-bold text-slate-900 text-base mt-3 leading-snug">${b.title}</h3>
              <p class="text-xs text-slate-500 mt-1">Penulis: ${b.author}</p>
            </div>
          </div>
        `).join('');
      } catch (err) {
        console.error("Gagal memuat katalog:", err);
      }
    }

    fetchKatalog();
  </script>
</body>
</html>
