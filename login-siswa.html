<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Anggota & Petugas - SMAN 4 Manado</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-200">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-blue-900">Perpustakaan SMAN 4 Manado</h1>
      <p class="text-slate-500 text-sm mt-1">Cari Nama & Masukkan Personal ID Anda</p>
    </div>

    <form id="loginForm" class="space-y-4">
      
      <!-- Input Nama dengan Dropdown Autocomplete -->
      <div class="relative">
        <label class="block text-sm font-semibold text-slate-700 mb-1">Cari Nama Lengkap</label>
        <input type="text" id="searchName" autocomplete="off" placeholder="Ketik nama Anda..." required
          class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-600 focus:border-transparent outline-none transition">
        
        <!-- Box Hasil Autocomplete -->
        <div id="autocompleteList" class="absolute left-0 right-0 top-full mt-1 bg-white border border-slate-200 rounded-lg shadow-lg hidden max-h-48 overflow-y-auto z-50"></div>
      </div>

      <!-- Detail Terisi Otomatis -->
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">ID Anggota</label>
          <input type="text" id="memberId" readonly class="w-full px-3 py-2 bg-slate-100 rounded-lg border border-slate-200 text-sm font-mono text-slate-600 outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">Kelas / Jabatan</label>
          <input type="text" id="classRole" readonly class="w-full px-3 py-2 bg-slate-100 rounded-lg border border-slate-200 text-sm text-slate-600 outline-none">
        </div>
      </div>

      <!-- Input Personal ID -->
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">Personal ID (PIN/Password)</label>
        <input type="password" id="personalId" placeholder="••••••••" required
          class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-600 focus:border-transparent outline-none transition">
      </div>

      <button type="submit"
        class="w-full bg-blue-700 hover:bg-blue-800 text-white font-semibold py-3 rounded-lg shadow-md hover:shadow-lg transition duration-200">
        Masuk Ke Akun
      </button>
    </form>
    
    <div id="alertBox" class="mt-4 hidden p-3 rounded-lg text-sm text-center"></div>
  </div>

  <script type="module">
    import { db } from './js/firebase-config.js';
    import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    let allMembers = [];
    let selectedUser = null;

    // Load data anggota saat halaman dibuka
    async function loadMembers() {
      try {
        const querySnapshot = await getDocs(collection(db, "members"));
        querySnapshot.forEach((doc) => {
          allMembers.push(doc.data());
        });
      } catch (err) {
        console.error("Gagal memuat data anggota:", err);
      }
    }
    loadMembers();

    const searchInput = document.getElementById('searchName');
    const autocompleteList = document.getElementById('autocompleteList');

    // Filter nama secara otomatis saat user mengetik
    searchInput.addEventListener('input', function() {
      const val = this.value.toLowerCase().trim();
      autocompleteList.innerHTML = '';

      if (!val) {
        autocompleteList.classList.add('hidden');
        return;
      }

      const matches = allMembers.filter(m => m.nama.toLowerCase().includes(val));

      if (matches.length > 0) {
        matches.forEach(item => {
          const div = document.createElement('div');
          div.className = "p-3 hover:bg-blue-50 cursor-pointer border-b border-slate-100 text-sm flex justify-between items-center";
          div.innerHTML = `
            <div>
              <div class="font-bold text-slate-800">${item.nama}</div>
              <div class="text-xs text-slate-500">${item.kelas} • <span class="font-mono text-blue-600">${item.memberId}</span></div>
            </div>
            <span class="text-xs px-2 py-0.5 rounded bg-blue-100 text-blue-800 font-semibold">${item.role || 'Siswa'}</span>
          `;

          // Ketika item diklik, isi field otomatis
          div.addEventListener('click', () => {
            searchInput.value = item.nama;
            document.getElementById('memberId').value = item.memberId;
            document.getElementById('classRole').value = item.kelas;
            selectedUser = item;
            autocompleteList.classList.add('hidden');
          });

          autocompleteList.appendChild(div);
        });
        autocompleteList.classList.remove('hidden');
      } else {
        autocompleteList.classList.add('hidden');
      }
    });

    // Proses Verifikasi Login
    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const inputPIN = document.getElementById('personalId').value.trim();
      const alertBox = document.getElementById('alertBox');

      if (!selectedUser) {
        alertBox.className = "mt-4 p-3 rounded-lg text-sm text-center bg-red-100 text-red-700 block";
        alertBox.innerText = "Pilih nama Anda dari daftar autocomplete terlebih dahulu!";
        return;
      }

      if (selectedUser.personalId === inputPIN) {
        localStorage.setItem('userSession', JSON.stringify(selectedUser));
        alertBox.className = "mt-4 p-3 rounded-lg text-sm text-center bg-green-100 text-green-700 block";
        alertBox.innerText = `Selamat datang, ${selectedUser.nama}! Mengalihkan...`;
        setTimeout(() => window.location.href = 'profil.html', 1000);
      } else {
        alertBox.className = "mt-4 p-3 rounded-lg text-sm text-center bg-red-100 text-red-700 block";
        alertBox.innerText = "Personal ID / PIN yang Anda masukkan salah!";
      }
    });
  </script>
</body>
</html>
