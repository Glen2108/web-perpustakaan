<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Siswa - Perpustakaan SMAN 4 Manado</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
          colors: { brand: { 800: '#1e3a8a', 900: '#0f172a', 600: '#2563eb', 500: '#3b82f6' } }
        }
      }
    }
  </script>
</head>
<body class="bg-gradient-to-br from-slate-950 via-slate-900 to-blue-950 min-h-screen flex items-center justify-center p-4 font-sans text-slate-100 relative overflow-hidden">

  <!-- Glowing backdrop blobs untuk memperkuat efek transparansi kaca -->
  <div class="absolute -top-32 -left-32 w-96 h-96 bg-amber-500/15 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-blue-600/20 rounded-full blur-3xl pointer-events-none"></div>

  <!-- Cek Otomatis Sesi Login (Persistent Session) -->
  <script>
    if (localStorage.getItem('userSession')) {
      window.location.href = "profil.html";
    }
  </script>

  <div class="w-full max-w-md space-y-4 relative z-10">
    <!-- Tombol Kembali ke Beranda Utama -->
    <a href="index.html" class="inline-flex items-center gap-2 text-xs font-semibold text-slate-300 hover:text-amber-400 transition">
      <i class="fa-solid fa-arrow-left"></i> Kembali ke Beranda Perpustakaan
    </a>

    <!-- Kartu Login Transparan (Glassmorphism) -->
    <div class="bg-slate-900/40 backdrop-blur-xl p-6 sm:p-8 rounded-3xl shadow-2xl border border-white/10 space-y-6">
      
      <!-- Header Logo & Judul -->
      <div class="text-center space-y-2">
        <div class="w-14 h-14 bg-gradient-to-tr from-amber-400 to-amber-200 text-slate-900 rounded-2xl flex items-center justify-center font-black text-2xl mx-auto shadow-lg shadow-amber-500/20">
          <i class="fa-solid fa-graduation-cap"></i>
        </div>
        <h2 class="text-2xl font-black text-white tracking-tight">Portal Siswa</h2>
        <p class="text-xs text-slate-300 max-w-xs mx-auto">
          Masukkan Username/NIS dan Kata Sandi resmi yang telah diberikan oleh petugas perpustakaan.
        </p>
      </div>

      <!-- Pesan Alert / Error -->
      <div id="alertBox" class="hidden p-3.5 rounded-xl text-xs font-bold bg-rose-500/10 border border-rose-500/30 text-rose-300 items-center gap-2">
        <i class="fa-solid fa-circle-exclamation shrink-0 text-base"></i>
        <span id="alertMsg">Username atau Password salah!</span>
      </div>

      <!-- Form Login -->
      <form id="formLoginSiswa" class="space-y-4">
        <div>
          <label class="block text-xs font-extrabold text-slate-300 mb-1.5 uppercase tracking-wider">
            Username / NIS
          </label>
          <div class="relative">
            <input type="text" id="userVal" required placeholder="Contoh: 20241001" 
                   class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-700/60 bg-slate-900/60 text-white placeholder-slate-500 text-xs font-semibold focus:border-amber-400 focus:ring-2 focus:ring-amber-400/30 outline-none transition">
            <i class="fa-solid fa-user absolute left-3.5 top-3.5 text-slate-400 text-xs"></i>
          </div>
        </div>

        <div>
          <label class="block text-xs font-extrabold text-slate-300 mb-1.5 uppercase tracking-wider">
            Password
          </label>
          <div class="relative">
            <input type="password" id="passVal" required placeholder="••••••••" 
                   class="w-full pl-10 pr-10 py-3 rounded-xl border border-slate-700/60 bg-slate-900/60 text-white placeholder-slate-500 text-xs font-semibold focus:border-amber-400 focus:ring-2 focus:ring-amber-400/30 outline-none transition">
            <i class="fa-solid fa-lock absolute left-3.5 top-3.5 text-slate-400 text-xs"></i>
            <button type="button" id="togglePass" class="absolute right-3.5 top-3.5 text-slate-400 hover:text-slate-200 text-xs">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" id="submitBtn" class="w-full bg-brand-600 hover:bg-brand-500 text-white font-bold py-3.5 rounded-xl text-xs shadow-lg shadow-blue-600/30 flex items-center justify-center gap-2 transition active:scale-[0.99]">
          <span id="btnText">Masuk Beranda Siswa</span>
          <i id="btnIcon" class="fa-solid fa-right-to-bracket"></i>
        </button>
      </form>

      <!-- Footer Bantuan -->
      <div class="pt-4 border-t border-slate-800/80 text-center text-[11px] text-slate-400">
        Lupa password atau akun bermasalah? <br>
        <span class="font-bold text-amber-300">Hubungi Petugas Perpustakaan SMAN 4 Manado</span>
      </div>

    </div>
  </div>

  <script type="module">
  import { db } from './js/firebase-config.js';
  import { collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  const form = document.getElementById('formLoginSiswa');
  const alertBox = document.getElementById('alertBox');
  const alertMsg = document.getElementById('alertMsg');
  const submitBtn = document.getElementById('submitBtn');
  const btnText = document.getElementById('btnText');
  const btnIcon = document.getElementById('btnIcon');
  const togglePass = document.getElementById('togglePass');
  const passVal = document.getElementById('passVal');

  togglePass.addEventListener('click', () => {
    const isPass = passVal.type === 'password';
    passVal.type = isPass ? 'text' : 'password';
    togglePass.innerHTML = isPass ? '<i class="fa-solid fa-eye-slash"></i>' : '<i class="fa-solid fa-eye"></i>';
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    alertBox.classList.add('hidden');
    
    const u = document.getElementById('userVal').value.trim();
    const p = passVal.value.trim();

    submitBtn.disabled = true;
    btnText.innerText = "Memeriksa Akun...";
    btnIcon.className = "fa-solid fa-spinner fa-spin";

    try {
      const colRef = collection(db, "anggota");
      
      // Pencarian fleksibel: Username, NISN, atau ID Anggota
      let q = query(colRef, where("username", "==", u), where("password", "==", p));
      let snap = await getDocs(q);

      if (snap.empty) {
        q = query(colRef, where("nisn", "==", u), where("password", "==", p));
        snap = await getDocs(q);
      }

      if (snap.empty) {
        q = query(colRef, where("id", "==", u), where("password", "==", p));
        snap = await getDocs(q);
      }

      if (!snap.empty) {
        const docData = snap.docs[0].data();
        const userData = { docId: snap.docs[0].id, ...docData };
        
        localStorage.setItem('userSession', JSON.stringify(userData));
        
        btnText.innerText = "Login Berhasil!";
        btnIcon.className = "fa-solid fa-circle-check";
        
        setTimeout(() => {
          window.location.href = "profil.html";
        }, 600);
      } else {
        showError("Username/NISN atau Password tidak cocok!");
      }
    } catch (err) {
      console.error(err);
      showError("Gagal terhubung ke server. Periksa koneksi internet Anda.");
    } finally {
      if (!localStorage.getItem('userSession')) {
        submitBtn.disabled = false;
        btnText.innerText = "Masuk Beranda Siswa";
        btnIcon.className = "fa-solid fa-right-to-bracket";
      }
    }
  });

  function showError(msg) {
    alertMsg.innerText = msg;
    alertBox.classList.remove('hidden');
    alertBox.classList.add('flex');
  }
  </script>
</body>
</html>
