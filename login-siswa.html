<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Siswa - Perpustakaan SMAN 4 Manado</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4">
  <div class="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-md space-y-6">
    <div class="text-center">
      <h2 class="text-2xl font-black text-slate-900">Login Siswa</h2>
      <p class="text-xs text-slate-500 mt-1">Gunakan akun yang telah dikirimkan via WhatsApp resmi.</p>
    </div>

    <form id="formLoginSiswa" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Username / NIS</label>
        <input type="text" id="userVal" required class="w-full px-4 py-2.5 rounded-xl border text-xs focus:ring-2 focus:ring-blue-600 outline-none">
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Password</label>
        <input type="password" id="passVal" required class="w-full px-4 py-2.5 rounded-xl border text-xs focus:ring-2 focus:ring-blue-600 outline-none">
      </div>
      <button type="submit" class="w-full bg-blue-700 hover:bg-blue-800 text-white font-bold py-3 rounded-xl text-xs shadow-md">
        Masuk Beranda Siswa
      </button>
    </form>
  </div>

  <script type="module">
    import { db } from './js/firebase-config.js';
    import { collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

    document.getElementById('formLoginSiswa').addEventListener('submit', async (e) => {
      e.preventDefault();
      const u = document.getElementById('userVal').value.trim();
      const p = document.getElementById('passVal').value.trim();

      try {
        const q = query(collection(db, "siswa"), where("username", "==", u), where("password", "==", p));
        const snap = await getDocs(q);

        if (!snap.empty) {
          const userData = snap.docs[0].data();
          localStorage.setItem('userSession', JSON.stringify(userData));
          alert("Login Berhasil!");
          window.location.href = "profil.html";
        } else {
          alert("Username atau Password salah!");
        }
      } catch (err) {
        alert("Terjadi kesalahan koneksi!");
      }
    });
  </script>
</body>
</html>
