<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Duta Literasi - Perpus SMAN 4 Manado</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-800">

  <!-- Header Navigasi -->
  <header class="bg-blue-900 text-white shadow-md">
    <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
      <h1 class="text-xl font-extrabold tracking-wide">Perpus SMAN 4 Manado</h1>
      <nav class="space-x-6 text-sm font-semibold">
        <a href="katalog.html" class="hover:text-blue-200">Katalog</a>
        <a href="duta-literasi.html" class="underline underline-offset-4 text-blue-200">Duta Literasi</a>
        <a href="admin/dashboard.html" class="bg-blue-800 hover:bg-blue-700 px-3 py-1.5 rounded-lg">Admin Panel</a>
      </nav>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-6 py-10 space-y-10">

    <!-- Banner Duta Literasi Terpilih -->
    <div class="bg-gradient-to-br from-blue-900 to-indigo-800 text-white rounded-3xl p-8 md:p-12 text-center shadow-xl relative overflow-hidden">
      <span id="badgePeriode" class="bg-amber-400 text-slate-900 font-extrabold text-xs px-4 py-1.5 rounded-full uppercase tracking-wider">
        MEMUAT PERIODE...
      </span>
      <h2 class="text-2xl md:text-4xl font-black mt-4">Selamat & Sukses!</h2>
      <p class="text-blue-200 text-sm mt-1">Duta Literasi Perpustakaan SMAN 4 Manado Terpilih</p>

      <!-- Card Profil Duta -->
      <div id="cardDutaTerpilih" class="mt-8 inline-block bg-white/10 backdrop-blur-md border border-white/20 p-6 rounded-2xl max-w-sm w-full">
        <div class="w-28 h-28 mx-auto rounded-full bg-slate-300 border-4 border-white shadow-md overflow-hidden flex items-center justify-center">
          <img id="fotoDuta" src="" alt="Foto Duta" class="w-full h-full object-cover hidden">
          <span id="placeholderFoto" class="text-slate-500 font-bold text-xs">Foto Duta</span>
        </div>
        <h3 id="namaDuta" class="text-xl font-bold mt-4">Belum Ada Duta</h3>
        <p id="kelasDuta" class="text-xs text-blue-200 mt-1">-</p>
        <p id="masaJabatan" class="text-[11px] bg-blue-950/60 mt-3 py-1.5 px-3 rounded-lg border border-blue-400/30 font-medium">
          Masa Jabatan: -
        </p>
      </div>
    </div>

    <!-- Section Tambah Kandidat / Duta Baru -->
    <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm space-y-4">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 class="font-bold text-slate-900 text-base">Tambah Calon / Duta Literasi Baru</h3>
        <span class="text-xs text-slate-400">Masa Jabatan Otomatis 2 Bulan</span>
      </div>

      <form id="formDuta" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Nama Siswa</label>
          <input type="text" id="inputNama" placeholder="Nama Lengkap" class="w-full px-3 py-2 border rounded-xl text-sm" required>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Kelas</label>
          <input type="text" id="inputKelas" placeholder="ex: XI MIPA 1" class="w-full px-3 py-2 border rounded-xl text-sm" required>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Periode Ke / Tahun</label>
          <input type="text" id="inputPeriode" placeholder="ex: Periode 2026/2027" class="w-full px-3 py-2 border rounded-xl text-sm" required>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Tanggal Dilantik (Apel Sekolah)</label>
          <input type="date" id="inputPelantikan" class="w-full px-3 py-2 border rounded-xl text-sm" required>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Foto (Maksimum 1 MB)</label>
          <input type="file" id="inputFotoFile" accept="image/*" class="w-full px-2 py-1.5 border rounded-xl text-xs" required>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Status Penetapan</label>
          <select id="inputStatus" class="w-full px-3 py-2 border rounded-xl text-sm">
            <option value="true">Langsung Terpilih Jadi Duta</option>
            <option value="false">Kandidat Calon Duta</option>
          </select>
        </div>
        <div class="md:col-span-2">
          <label class="block text-xs font-bold text-slate-700 mb-1">Visi / Slogan Literasi</label>
          <input type="text" id="inputSlogan" placeholder="slogan atau visi..." class="w-full px-3 py-2 border rounded-xl text-sm">
        </div>
        <div class="md:col-span-2 flex justify-end pt-2">
          <button type="submit" class="bg-blue-700 hover:bg-blue-800 text-white text-xs font-bold px-6 py-2.5 rounded-xl shadow transition">
            Simpan Data Duta Literasi
          </button>
        </div>
      </form>
    </div>

    <!-- Daftar Kandidat Calon Duta Literasi -->
    <div>
      <h3 class="text-xl font-bold text-slate-900 mb-4">Kandidat Calon Duta Literasi</h3>
      <div id="gridKandidat" class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <!-- List kandidat dimuat dinamis -->
      </div>
    </div>

  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDhm-T5p4l4-Tgg79apq8OATQkKrAoJ-e0",
      authDomain: "web-perpustakaan-e3ae8.firebaseapp.com",
      projectId: "web-perpustakaan-e3ae8",
      storageBucket: "web-perpustakaan-e3ae8.firebasestorage.app",
      appId: "1:960845187515:web:9333b70d1052fc66435c9e"
    };

    initializeApp(firebaseConfig);
    const ENDPOINT = "https://us-central1-web-perpustakaan-e3ae8.cloudfunctions.net/dataConnect";

    // Validasi Ukuran Foto File (Maksimal 1MB = 1.048.576 Bytes)
    let photoBase64 = "";
    document.getElementById("inputFotoFile").addEventListener("change", function(e) {
      const file = e.target.files[0];
      if (!file) return;

      if (file.size > 1024 * 1024) {
        alert("Ukuran file foto melebihi 1 MB! Silakan pilih foto dengan ukuran lebih kecil.");
        this.value = "";
        photoBase64 = "";
        return;
      }

      const reader = new FileReader();
      reader.onload = () => { photoBase64 = reader.result; };
      reader.readAsDataURL(file);
    });

    // Simpan Data Duta (Otomatis Hitung +2 Bulan Masa Jabatan)
    document.getElementById("formDuta").addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!photoBase64) return alert("Silakan unggah foto dengan ukuran di bawah 1MB.");

      const nama = document.getElementById("inputNama").value;
      const kelas = document.getElementById("inputKelas").value;
      const periode = document.getElementById("inputPeriode").value;
      const tglPelantikanStr = document.getElementById("inputPelantikan").value;
      const isSelected = document.getElementById("inputStatus").value === "true";
      const slogan = document.getElementById("inputSlogan").value;

      // Kalkulasi Tanggal Akhir Jabatan (+ 2 Bulan)
      const tglPelantikan = new Date(tglPelantikanStr);
      const tglBerakhir = new Date(tglPelantikan);
      tglBerakhir.setMonth(tglBerakhir.getMonth() + 2);
      const tglBerakhirStr = tglBerakhir.toISOString().split('T')[0];

      const mutation = `
        mutation {
          literacyAmbassador_insert(data: {
            studentName: "${nama}",
            studentClass: "${kelas}",
            termPeriod: "${periode}",
            inaugurationDate: "${tglPelantikanStr}",
            endDate: "${tglBerakhirStr}",
            isSelected: ${isSelected},
            photoUrl: "${photoBase64}",
            slogan: "${slogan}"
          })
        }
      `;

      await fetch(ENDPOINT, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ query: mutation }) });
      alert("Data Duta Literasi berhasil disimpan!");
      e.target.reset();
      photoBase64 = "";
      fetchDuta();
    });

    // Load Data Duta
    async function fetchDuta() {
      const query = `query { literacyAmbassadors { id studentName studentClass termPeriod inaugurationDate endDate isSelected photoUrl slogan } }`;
      try {
        const res = await fetch(ENDPOINT, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ query }) });
        const { data } = await res.json();
        const list = data?.literacyAmbassadors || [];

        const terpilih = list.find(d => d.isSelected);
        if (terpilih) {
          document.getElementById("badgePeriode").innerText = terpilih.termPeriod || "PERIODE AKTIF";
          document.getElementById("namaDuta").innerText = terpilih.studentName;
          document.getElementById("kelasDuta").innerText = terpilih.studentClass;
          document.getElementById("masaJabatan").innerText = `Masa Jabatan: ${terpilih.inaugurationDate} s.d ${terpilih.endDate} (2 Bulan)`;
          if (terpilih.photoUrl) {
            const img = document.getElementById("fotoDuta");
            img.src = terpilih.photoUrl;
            img.classList.remove("hidden");
            document.getElementById("placeholderFoto").classList.add("hidden");
          }
        }

        const kandidatList = list.filter(d => !d.isSelected);
        const grid = document.getElementById("gridKandidat");
        grid.innerHTML = kandidatList.map(k => `
          <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
            <h4 class="font-bold text-slate-800 text-sm">${k.studentName}</h4>
            <p class="text-xs text-slate-500">${k.studentClass}</p>
            <p class="text-xs text-slate-600 italic mt-2">"${k.slogan || '-'}"</p>
          </div>
        `).join('') || `<p class="text-xs text-slate-400">Belum ada kandidat tambahan.</p>`;

      } catch (err) { console.error("Gagal memuat Duta Literasi:", err); }
    }

    fetchDuta();
  </script>
</body>
</html>
