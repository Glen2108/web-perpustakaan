<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Duta Literasi - SMAN 4 Manado</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800">

  <main class="max-w-5xl mx-auto p-6 space-y-10">
    
    <!-- Ucapan Selamat Duta Literasi Terpilih -->
    <section class="bg-gradient-to-r from-blue-900 to-indigo-800 text-white rounded-3xl p-8 shadow-xl text-center">
      <span class="bg-yellow-400 text-blue-950 font-extrabold text-xs px-3 py-1 rounded-full uppercase tracking-wider">Periode 2026/2027</span>
      <h1 class="text-3xl font-extrabold mt-4">Selamat & Sukses!</h1>
      <p class="text-blue-200 mt-1">Duta Literasi Perpustakaan SMAN 4 Manado Terpilih</p>

      <div class="mt-6 flex flex-col sm:flex-row justify-center items-center gap-6">
        <div class="bg-white/10 backdrop-blur-md p-4 rounded-2xl border border-white/20 w-48 text-center">
          <div class="w-24 h-24 bg-slate-300 rounded-full mx-auto mb-3 overflow-hidden">
            <img src="assets/duta1.jpg" alt="Foto Duta" class="w-full h-full object-cover">
          </div>
          <h3 class="font-bold text-lg">Siti Rahma</h3>
          <p class="text-xs text-blue-200">Kelas XI MIPA 1</p>
        </div>
      </div>
    </section>

    <!-- Calon Duta Literasi -->
    <section>
      <h2 class="text-2xl font-bold mb-4">Kandidat Calon Duta Literasi</h2>
      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
        <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
          <h3 class="font-bold text-slate-900">1. Jonathan R.</h3>
          <p class="text-xs text-slate-500 mb-2">Kelas X-A</p>
          <p class="text-sm text-slate-600">"Meningkatkan minat baca digital lewat aplikasi perpustakaan sekolah."</p>
        </div>
      </div>
    </section>

  </main>
</body>
</html>
