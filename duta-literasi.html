<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Duta Literasi - Perpus SMAN 4 Manado</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800">

  <header class="bg-blue-900 text-white shadow-md">
    <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
      <h1 class="text-xl font-extrabold tracking-wide">Perpus SMAN 4 Manado</h1>
      <nav class="space-x-6 text-sm font-semibold">
        <a href="index.html" class="hover:text-blue-200">Beranda</a>
        <a href="katalog.html" class="hover:text-blue-200">Katalog</a>
        <a href="duta-literasi.html" class="underline underline-offset-4 text-blue-200">Duta Literasi</a>
        <a href="admin/dashboard.html" class="bg-blue-800 hover:bg-blue-700 px-3 py-1.5 rounded-lg">Admin Panel</a>
      </nav>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-6 py-10 space-y-10">
    <div class="bg-gradient-to-br from-blue-900 to-indigo-800 text-white rounded-3xl p-8 text-center shadow-xl">
      <h2 class="text-2xl md:text-4xl font-black">Duta Literasi Sekolah</h2>
      <p class="text-blue-200 text-sm mt-1">Perpustakaan SMAN 4 Manado</p>
      
      <div id="cardDuta" class="mt-6 bg-white/10 p-6 rounded-2xl max-w-sm mx-auto">
        <h3 id="namaDuta" class="text-xl font-bold">Memuat Duta...</h3>
        <p id="sloganDuta" class="text-xs text-blue-200 mt-2">-</p>
      </div>
    </div>
  </main>

  <script type="module">
    import { ENDPOINT } from './js/firebase-config.js';

    async function fetchDuta() {
      const query = `query { literacyAmbassadors { studentId slogan isSelected } }`;
      try {
        const res = await fetch(ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query })
        });
        const { data } = await res.json();
        const list = data?.literacyAmbassadors || [];
        const terpilih = list.find(d => d.isSelected);

        if (terpilih) {
          document.getElementById("namaDuta").innerText = terpilih.studentId;
          document.getElementById("sloganDuta").innerText = `"${terpilih.slogan || ''}"`;
        }
      } catch (err) {
        console.error("Gagal memuat Duta:", err);
      }
    }

    fetchDuta();
  </script>
</body>
</html>
