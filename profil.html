<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil Anggota - SMAN 4 Manado</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 p-6">
  <div class="max-w-lg mx-auto bg-white rounded-3xl p-6 shadow-xl space-y-6">
    <div class="flex justify-between items-center border-b pb-4">
      <h3 class="font-black text-xl text-slate-900">Profil Anggota Perpustakaan</h3>
      <button onclick="logout()" class="text-xs bg-rose-600 text-white font-bold px-3 py-1.5 rounded-lg">Logout</button>
    </div>

    <div class="space-y-3 text-xs">
      <div class="flex justify-between py-1 border-b"><span class="text-slate-500">Nama Lengkap:</span><strong id="pNama">-</strong></div>
      <div class="flex justify-between py-1 border-b"><span class="text-slate-500">Kelas:</span><strong id="pKelas">-</strong></div>
      <div class="flex justify-between py-1 border-b"><span class="text-slate-500">Alamat:</span><strong id="pAlamat">-</strong></div>
      <div class="flex justify-between py-1 border-b"><span class="text-slate-500">Nomor Telepon:</span><strong id="pTelp">-</strong></div>
      <div class="flex justify-between py-1 border-b"><span class="text-slate-500">ID Anggota:</span><strong id="pID" class="font-mono text-blue-700">-</strong></div>
      <div class="flex justify-between py-1 border-b"><span class="text-slate-500">Personal ID:</span><strong id="pPersonal" class="font-mono text-slate-800">-</strong></div>
    </div>

    <a href="katalog.html" class="block text-center w-full bg-blue-700 text-white font-bold py-2.5 rounded-xl text-xs">Menuju Katalog Buku</a>
  </div>

  <script>
    const user = JSON.parse(localStorage.getItem('userSession'));
    if (!user) {
      window.location.href = "login-siswa.html";
    } else {
      document.getElementById('pNama').innerText = user.nama || '-';
      document.getElementById('pKelas').innerText = user.kelas || '-';
      document.getElementById('pAlamat').innerText = user.alamat || '-';
      document.getElementById('pTelp').innerText = user.noTelp || '-';
      document.getElementById('pID').innerText = user.memberId || '-';
      document.getElementById('pPersonal').innerText = user.personalId || '-';
    }

    function logout() {
      localStorage.removeItem('userSession');
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
