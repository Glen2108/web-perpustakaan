<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Admin - Perpustakaan SMAN 4 Manado</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen flex flex-col md:flex-row">

  <!-- Sidebar Navigasi -->
  <aside class="w-full md:w-64 bg-slate-900 text-white flex-shrink-0 flex flex-col justify-between p-6 shadow-xl">
    <div>
      <div class="flex items-center space-x-3 mb-8">
        <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center font-bold text-lg shadow-lg">
          <i class="fa-solid fa-book-bookmark"></i>
        </div>
        <div>
          <h1 class="font-bold text-base leading-tight">Admin Perpus</h1>
          <p class="text-xs text-blue-400 font-medium">SMAN 4 Manado</p>
        </div>
      </div>

      <nav class="space-y-2 text-sm font-semibold">
        <a href="../index.html" class="flex items-center space-x-3 text-slate-400 hover:bg-slate-800 hover:text-white px-4 py-3 rounded-xl transition">
          <i class="fa-solid fa-house"></i>
          <span>Beranda Situs</span>
        </a>
        <a href="#panel" class="flex items-center space-x-3 bg-blue-800 text-white px-4 py-3 rounded-xl shadow">
          <i class="fa-solid fa-users"></i>
          <span>Kelola Sistem</span>
        </a>
      </nav>
    </div>

    <div class="pt-6 border-t border-slate-800">
      <button onclick="logoutAdmin()" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-2.5 rounded-xl text-xs flex items-center justify-center gap-2">
        <i class="fa-solid fa-right-from-bracket"></i> Keluar
      </button>
    </div>
  </aside>

  <!-- Content Area -->
  <main class="flex-1 p-6 md:p-10 space-y-6">
    <div class="flex justify-between items-center border-b pb-4">
      <div>
        <h2 class="text-2xl font-black text-slate-900">Dashboard Pengelola</h2>
        <p class="text-xs text-slate-500">Panel Administrasi Sistem Perpustakaan Digital</p>
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
        <div class="text-slate-500 text-xs font-bold uppercase">Status Admin</div>
        <div class="text-lg font-black text-emerald-600 mt-2">Aktif</div>
      </div>
      <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
        <div class="text-slate-500 text-xs font-bold uppercase">Akses Basis Data</div>
        <div class="text-lg font-black text-blue-600 mt-2">Terhubung</div>
      </div>
    </div>
  </main>

  <script>
    if (!localStorage.getItem('adminSession')) {
      window.location.href = 'login.html';
    }

    function logoutAdmin() {
      localStorage.removeItem('adminSession');
      window.location.href = 'login.html';
    }
  </script>
</body>
</html>
