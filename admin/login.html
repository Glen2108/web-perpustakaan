<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin - Perpustakaan SMAN 4 Manado</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4">
  <div class="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-md space-y-6">
    <div class="text-center">
      <h2 class="text-2xl font-black text-slate-900">Portal Admin & Petugas</h2>
      <p class="text-xs text-slate-500 mt-1">Autentikasi Pengelola Perpustakaan</p>
    </div>

    <form id="formAdminLogin" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Email / Username Admin</label>
        <input type="email" id="emailVal" required class="w-full px-4 py-2.5 rounded-xl border text-xs focus:ring-2 focus:ring-indigo-600 outline-none">
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Password</label>
        <input type="password" id="passVal" required class="w-full px-4 py-2.5 rounded-xl border text-xs focus:ring-2 focus:ring-indigo-600 outline-none">
      </div>
      <button type="submit" class="w-full bg-indigo-700 hover:bg-indigo-800 text-white font-bold py-3 rounded-xl text-xs shadow-md">
        Masuk Dashboard Admin
      </button>
    </form>
  </div>

  <script type="module">
    import { auth } from '../js/firebase-config.js';
    import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

    document.getElementById('formAdminLogin').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('emailVal').value;
      const pass = document.getElementById('passVal').value;

      try {
        await signInWithEmailAndPassword(auth, email, pass);
        alert("Login Admin Berhasil!");
        window.location.href = "dashboard.html";
      } catch (err) {
        alert("Gagal Login Admin: " + err.message);
      }
    });
  </script>
</body>
</html>
