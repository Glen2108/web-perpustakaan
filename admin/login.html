<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin - Perpus SMAN 4 Manado</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 space-y-6 border border-slate-200">
    <div class="text-center space-y-2">
      <div class="w-16 h-16 bg-blue-900 text-white rounded-full flex items-center justify-center text-2xl font-bold mx-auto">
        🔑
      </div>
      <h2 class="text-2xl font-bold text-slate-800">Login Pengelola / Admin</h2>
      <p class="text-sm text-slate-500">Perpustakaan SMAN 4 Manado</p>
    </div>

    <form class="space-y-4" onsubmit="event.preventDefault(); window.location.href='dashboard.html';">
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">Username / Email</label>
        <input type="text" required placeholder="admin@sman4manado.sch.id" class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-600 focus:outline-none">
      </div>
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">Kata Sandi</label>
        <input type="password" required placeholder="••••••••" class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-600 focus:outline-none">
      </div>
      <button type="submit" class="w-full bg-blue-900 hover:bg-blue-800 text-white font-bold py-3 rounded-lg transition shadow-md">
        Masuk ke Dashboard
      </button>
    </form>

    <div class="text-center pt-2">
      <a href="../index.html" class="text-sm text-blue-700 hover:underline">← Kembali ke Beranda Utama</a>
    </div>
  </div>
</body>
</html>
