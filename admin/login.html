<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin - Perpus SMAN 4 Manado</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 space-y-6 border border-slate-200">
    <div class="text-center space-y-2">
      <div class="w-16 h-16 bg-blue-900 text-white rounded-full flex items-center justify-center text-2xl font-bold mx-auto shadow-md">
        🔑
      </div>
      <h1 class="text-2xl font-bold text-slate-800">Login Pengelola / Admin</h1>
      <p class="text-sm text-slate-500">Perpustakaan SMAN 4 Manado</p>
    </div>

    <form id="adminLoginForm" class="space-y-4">
      <div>
        <label for="adminEmail" class="block text-sm font-semibold text-slate-700 mb-1">Username / Email</label>
        <input type="email" id="adminEmail" required placeholder="admin@sman4manado.sch.id" autocomplete="username"
          class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-600 focus:border-transparent outline-none transition">
      </div>

      <div>
        <label for="adminPassword" class="block text-sm font-semibold text-slate-700 mb-1">Kata Sandi</label>
        <div class="relative">
          <input type="password" id="adminPassword" required placeholder="••••••••" autocomplete="current-password"
            class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-600 focus:border-transparent outline-none transition pr-10">
          <button type="button" id="togglePassword" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 focus:outline-none text-sm">
            👁️
          </button>
        </div>
      </div>

      <button type="submit" id="submitBtn"
        class="w-full bg-blue-900 hover:bg-blue-800 text-white font-bold py-3 rounded-lg transition shadow-md hover:shadow-lg disabled:opacity-50">
        Masuk ke Dashboard
      </button>
    </form>

    <div id="alertBox" class="hidden p-3 rounded-lg text-sm text-center"></div>

    <div class="text-center pt-2">
      <a href="../index.html" class="text-sm text-blue-700 hover:underline">← Kembali ke Beranda Utama</a>
    </div>
  </div>

  <script type="module">
    import { auth } from './js/firebase-config.js';
    import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const adminLoginForm = document.getElementById('adminLoginForm');
    const adminEmail = document.getElementById('adminEmail');
    const adminPassword = document.getElementById('adminPassword');
    const togglePasswordBtn = document.getElementById('togglePassword');
    const submitBtn = document.getElementById('submitBtn');
    const alertBox = document.getElementById('alertBox');

    function showAlert(message, type = 'error') {
      alertBox.className = `p-3 rounded-lg text-sm text-center block ${
        type === 'success' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'
      }`;
      alertBox.innerText = message;
    }

    // Fitur Toggle Tampilkan / Sembunyikan Kata Sandi
    togglePasswordBtn.addEventListener('click', () => {
      const isPassword = adminPassword.type === 'password';
      adminPassword.type = isPassword ? 'text' : 'password';
      togglePasswordBtn.innerText = isPassword ? '🙈' : '👁️';
    });

    // Proses Autentikasi Form Login
    adminLoginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = adminEmail.value.trim();
      const password = adminPassword.value.trim();

      if (!email || !password) {
        showAlert('Email dan kata sandi wajib diisi.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = 'Memproses...';

      try {
        if (auth) {
          const userCredential = await signInWithEmailAndPassword(auth, email, password);
          localStorage.setItem('adminSession', JSON.stringify({
            uid: userCredential.user.uid,
            email: userCredential.user.email,
            role: 'Admin'
          }));
        } else {
          localStorage.setItem('adminSession', JSON.stringify({ email, role: 'Admin' }));
        }

        showAlert('Login berhasil! Mengalihkan ke dashboard...', 'success');
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 1000);
      } catch (error) {
        console.error('Login error:', error);
        showAlert('Gagal masuk: Email atau kata sandi salah.');
        submitBtn.disabled = false;
        submitBtn.innerText = 'Masuk ke Dashboard';
      }
    });
  </script>
</body>
</html>
