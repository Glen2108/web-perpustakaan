<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin - Perpustakaan SMAN 4 Manado</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md border border-slate-200">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-black text-slate-900">Login Administrator</h1>
      <p class="text-slate-500 text-sm mt-1">Perpustakaan SMAN 4 Manado</p>
    </div>

    <form id="adminLoginForm" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Username Admin</label>
        <input type="text" id="username" placeholder="admin" required class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:ring-2 focus:ring-blue-600 outline-none">
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Password</label>
        <input type="password" id="password" placeholder="••••••••" required class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:ring-2 focus:ring-blue-600 outline-none">
      </div>
      <button type="submit" class="w-full bg-blue-900 hover:bg-blue-950 text-white font-bold py-3 rounded-xl shadow-md transition">
        Masuk Admin Panel
      </button>
    </form>

    <div class="mt-4 text-center">
      <a href="../index.html" class="text-xs text-blue-600 hover:underline">← Kembali ke Halaman Utama</a>
    </div>
  </div>

  <script>
    document.getElementById('adminLoginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value.trim();

      if (user === 'admin' && pass === 'admin123') {
        localStorage.setItem('adminSession', JSON.stringify({ role: 'admin', user: 'Administrator' }));
        window.location.href = 'dashboard.html';
      } else {
        alert('Username atau password admin salah!');
      }
    });
  </script>
</body>
</html>
